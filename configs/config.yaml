shap_calculator:
  # SHAP calculation settings
  shap_settings:
    val_data_path: "/cmnfs/proj/shap-prosit/data/denovo/phosphorylation_shap.parquet" # read
    output_dir: phospho2 # write
    bgd_loc_path: # read: Path or leave empty to generate and save new permutation
    base_samp: 100000 # setting
    bgd_sz: 100 # setting
    inputs_ignored: 2 # read/setting: Trailing attributes to ignore for explanations in input vector
    dataset_queries: # setting
      - "method == 'HCD'"
    bgd_queries: # setting
      - "peptide_length > 9"
    which: correct # None = everything, correct = correct predictions, incorrect = incorrect predictions
  
  # Reconstituting a saved torch model
  model_settings:
    model_type: mdlm # setting
    koina:
      model_path: Prosit_2024_intensity_PTMs_ac # setting/read
      server_url: '10.162.163.66:9500' # setting
      ssl: False # setting
    local:
      model_path: "/cmnfs/proj/diffusion/experiments/2026-09-15_14-01-56" # read
      diffusion_steps: 0

